# Local pre-commit hooks. Emergency escape: SKIP=test,sast,vuln,secrets,fmt,aot git commit
# Install once: make hooks   (or: pre-commit install)
repos:
  - repo: local
    hooks:
      - id: test
        name: dart test
        language: system
        entry: make test
        pass_filenames: false
        always_run: true
      - id: sast
        name: dart analyze
        language: system
        entry: make sast
        pass_filenames: false
        always_run: true
      - id: vuln
        name: osv-scanner
        language: system
        entry: make vuln
        pass_filenames: false
        always_run: true
      - id: secrets
        name: gitleaks
        language: system
        entry: make secrets
        pass_filenames: false
        always_run: true
      - id: fmt
        name: dart format
        language: system
        entry: make fmt-check
        pass_filenames: false
        always_run: true
      - id: aot
        name: dart compile exe
        language: system
        entry: make aot
        pass_filenames: false
        always_run: true
